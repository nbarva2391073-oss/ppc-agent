name: BA Request SQP Monthly
on:
  schedule:
    - cron: '0 7 6 * *'     # 6-го: Amazon публікує місячний SQP за попередній місяць ≈4–5-го
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  ba-request-sqp-monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: Request monthly SQP
        env:
          AMAZON_CLIENT_ID:         ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET:     ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_REFRESH_TOKEN_USA: ${{ secrets.AMAZON_REFRESH_TOKEN_USA }}
          AMAZON_REFRESH_TOKEN_CA:  ${{ secrets.AMAZON_REFRESH_TOKEN_CA }}
          GOOGLE_CREDENTIALS_JSON:  ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python main_brand_analytics.py --request-sqp-monthly
