name: Diag SP Audit (one-off, read-only)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ADS_CLIENT_ID:           ${{ secrets.ADS_CLIENT_ID }}
      ADS_CLIENT_SECRET:       ${{ secrets.ADS_CLIENT_SECRET }}
      ADS_REFRESH_TOKEN:       ${{ secrets.ADS_REFRESH_TOKEN }}
      ADS_PROFILE_ID_USA:      ${{ secrets.ADS_PROFILE_ID_USA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python diag_sp_audit.py
      - name: Commit evidence
        if: always()
        run: |
          git config user.name "ppc-agent-bot"; git config user.email "bot@ppc-agent"
          git add diag/sp_audit || true
          git commit -m "Diag SP audit USA (raw API responses, read-only)" || echo nothing
          for i in 1 2 3 4; do git fetch origin main && git rebase -X theirs origin/main && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
