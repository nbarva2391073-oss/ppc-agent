name: Backfill TACoS

on:
  workflow_dispatch:
    inputs:
      market:
        description: 'USA або CA'
        required: true
        type: string
      dates:
        description: 'Дати через пробіл'
        required: true
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Backfill
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python backfill_tacos.py ${{ inputs.market }} ${{ inputs.dates }}
