name: Debug Suggested Bids

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Test bid recommendations endpoint
        env:
          ADS_CLIENT_ID:      ${{ secrets.ADS_CLIENT_ID }}
          ADS_CLIENT_SECRET:  ${{ secrets.ADS_CLIENT_SECRET }}
          ADS_REFRESH_TOKEN:  ${{ secrets.ADS_REFRESH_TOKEN }}
          ADS_PROFILE_ID_USA: ${{ secrets.ADS_PROFILE_ID_USA }}
        run: |
          python3 << 'PYEOF'
          import requests, json, os

          ADS_TOKEN_URL = "https://api.amazon.com/auth/o2/token"
          ADS_BASE_URL  = "https://advertising-api.amazon.com"

          CLIENT_ID     = os.environ["ADS_CLIENT_ID"]
          CLIENT_SECRET = os.environ["ADS_CLIENT_SECRET"]
          REFRESH_TOKEN = os.environ["ADS_REFRESH_TOKEN"]
          PROFILE_ID    = os.environ["ADS_PROFILE_ID_USA"]

          # Токен
          r = requests.post(ADS_TOKEN_URL, data={
              "grant_type": "refresh_token",
              "refresh_token": REFRESH_TOKEN,
              "client_id": CLIENT_ID,
              "client_secret": CLIENT_SECRET,
          })
          token = r.json()["access_token"]
          print("✅ Токен отримано")

          # Отримуємо реальний adGroupId і campaignId
          ct_kw = "application/vnd.spKeyword.v3+json"
          h_kw = {
              "Authorization": f"Bearer {token}",
              "Amazon-Advertising-API-ClientId": CLIENT_ID,
              "Amazon-Advertising-API-Scope": PROFILE_ID,
              "Content-Type": ct_kw,
              "Accept": ct_kw,
          }
          kw_resp = requests.post(
              f"{ADS_BASE_URL}/sp/keywords/list", headers=h_kw,
              json={"stateFilter": {"include": ["ENABLED"]}, "maxResults": 1}
          )
          kws = kw_resp.json().get("keywords", [])
          if not kws:
              print(f"❌ Немає keywords: {kw_resp.status_code} {kw_resp.text[:300]}")
              exit(1)

          kw = kws[0]
          adgroup_id  = str(kw.get("adGroupId", ""))
          campaign_id = str(kw.get("campaignId", ""))
          kw_text     = kw.get("keywordText", "")
          match_type  = kw.get("matchType", "")
          print(f"✅ adGroupId={adgroup_id}")
          print(f"   campaignId={campaign_id}")
          print(f"   keyword='{kw_text}', matchType={match_type}")

          # Тест /sp/targets/bid/recommendations
          ct = "application/vnd.spTargetingClause.v3+json"
          h = {
              "Authorization": f"Bearer {token}",
              "Amazon-Advertising-API-ClientId": CLIENT_ID,
              "Amazon-Advertising-API-Scope": PROFILE_ID,
              "Content-Type": ct,
              "Accept": ct,
          }

          payload = {
              "campaignId": campaign_id,
              "adGroupId": adgroup_id,
              "recommendationType": "BIDS_FOR_EXISTING_AD_GROUP",
              "targetingExpressions": [
                  {"type": "KEYWORD_EXACT_MATCH", "value": kw_text}
              ],
          }

          print(f"\n🔍 TEST 1: POST /sp/targets/bid/recommendations")
          print(f"   Content-Type: {ct}")
          print(f"   Body: {json.dumps(payload, indent=2)}")

          resp = requests.post(
              f"{ADS_BASE_URL}/sp/targets/bid/recommendations",
              headers=h, json=payload
          )
          print(f"\n📥 Status: {resp.status_code}")
          print(f"   Response Headers:")
          for k, v in resp.headers.items():
              print(f"     {k}: {v}")
          print(f"\n   Body: {resp.text[:1000]}")

          # Тест 2: той самий endpoint але з application/json
          print(f"\n🔍 TEST 2: те саме але Content-Type: application/json")
          h2 = dict(h)
          h2["Content-Type"] = "application/json"
          h2["Accept"] = "application/json"
          resp2 = requests.post(
              f"{ADS_BASE_URL}/sp/targets/bid/recommendations",
              headers=h2, json=payload
          )
          print(f"\n📥 Status: {resp2.status_code}")
          print(f"   Body: {resp2.text[:500]}")
          PYEOF
