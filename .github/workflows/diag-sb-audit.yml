name: Diag SB Audit (one-off, read-only)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: SB audit
        env:
          ADS_CLIENT_ID:      ${{ secrets.ADS_CLIENT_ID }}
          ADS_CLIENT_SECRET:  ${{ secrets.ADS_CLIENT_SECRET }}
          ADS_REFRESH_TOKEN:  ${{ secrets.ADS_REFRESH_TOKEN }}
          ADS_PROFILE_ID_USA: ${{ secrets.ADS_PROFILE_ID_USA }}
          ADS_PROFILE_ID_CA:  ${{ secrets.ADS_PROFILE_ID_CA }}
        run: python diag_sb_audit.py
      - name: Commit
        if: always()
        run: |
          git config user.name "ppc-agent-bot"
          git config user.email "bot@ppc-agent"
          git add diag/sb_audit
          git commit -m "Diag SB audit USA (raw API responses, read-only)" || echo nothing
          git pull --rebase origin main
          git push
