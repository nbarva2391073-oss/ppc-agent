name: Influencer Finder

on:
  # ПАУЗА (15.09.2026): Influencer Finder збирає дані некоректно
  # (підписники=0, іспанська не фільтрується, багато вкладок порожні).
  # Автозапуск вимкнено до виправлення багів, лишається ручний запуск.
  # schedule:
  #   - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  influencer-finder:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Influencer Finder
        env:
          APIFY_TOKEN:             ${{ secrets.APIFY_TOKEN }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID:          ${{ secrets.INFLUENCER_SPREADSHEET_ID }}
        run: python agents/influencer_finder.py
