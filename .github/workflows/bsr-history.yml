name: BSR History (daily)
on:
  schedule:
    - cron: '5 6 * * *'
  workflow_dispatch:
    inputs:
      market: { default: "USA" }
      dry_run: { default: "" }
permissions:
  contents: write
concurrency:
  group: bsr-write
  cancel-in-progress: false
jobs:
  bsr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AMAZON_CLIENT_ID:         ${{ secrets.AMAZON_CLIENT_ID }}
      AMAZON_CLIENT_SECRET:     ${{ secrets.AMAZON_CLIENT_SECRET }}
      AMAZON_REFRESH_TOKEN_USA: ${{ secrets.AMAZON_REFRESH_TOKEN_USA }}
      AMAZON_REFRESH_TOKEN_CA:  ${{ secrets.AMAZON_REFRESH_TOKEN_CA }}
      GOOGLE_CREDENTIALS_JSON:  ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      MARKET:  ${{ github.event.inputs.market || 'USA' }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: |
          mkdir -p diag/bsr
          python bsr_history.py 2>&1 | tee diag/bsr/last_run.log; test ${PIPESTATUS[0]} -eq 0
      - name: Commit evidence (always)
        if: always()
        run: |
          git config user.name "ppc-agent-bot"; git config user.email "bot@ppc-agent"
          git add diag/bsr || true
          git commit -m "BSR history evidence" || echo nothing
          for i in 1 2 3 4; do git fetch origin main && git rebase -X theirs origin/main && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
