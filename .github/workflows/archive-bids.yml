name: Archive old Suggested Bids
on:
  schedule:
    - cron: '30 5 * * 0'
  workflow_dispatch:
    inputs:
      retention_days: { description: "Скільки днів лишати в основній вкладці", default: "30" }
      dry_run: { description: "1 = тільки порахувати", default: "" }
permissions:
  contents: write
concurrency:
  group: sheets-sp-write
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      RETENTION_DAYS: ${{ github.event.inputs.retention_days || '30' }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python archive_bids.py
      - name: Commit result (always)
        if: always()
        run: |
          git config user.name "ppc-agent-bot"; git config user.email "bot@ppc-agent"
          git add diag/archive_bids || true
          git commit -m "Archive bids result" || echo nothing
          for i in 1 2 3 4; do git fetch origin main && git rebase -X theirs origin/main && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
