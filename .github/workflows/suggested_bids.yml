name: Suggested Bids

on:
  schedule:
    - cron: '0 8 */2 * *'
  workflow_dispatch: {}

jobs:
  suggested-bids:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Suggested Bids
        env:
          ADS_CLIENT_ID:          ${{ secrets.ADS_CLIENT_ID }}
          ADS_CLIENT_SECRET:      ${{ secrets.ADS_CLIENT_SECRET }}
          ADS_REFRESH_TOKEN:      ${{ secrets.ADS_REFRESH_TOKEN }}
          ADS_PROFILE_ID_USA:     ${{ secrets.ADS_PROFILE_ID_USA }}
          ADS_PROFILE_ID_CA:      ${{ secrets.ADS_PROFILE_ID_CA }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python suggested_bids.py
