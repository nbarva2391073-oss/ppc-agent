name: Restore Control Week Source Data (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Restore source data (Amazon Ads API, no Sheets write)
        env:
          ADS_CLIENT_ID:      ${{ secrets.ADS_CLIENT_ID }}
          ADS_CLIENT_SECRET:  ${{ secrets.ADS_CLIENT_SECRET }}
          ADS_REFRESH_TOKEN:  ${{ secrets.ADS_REFRESH_TOKEN }}
          ADS_PROFILE_ID_USA: ${{ secrets.ADS_PROFILE_ID_USA }}
          ADS_PROFILE_ID_CA:  ${{ secrets.ADS_PROFILE_ID_CA }}
        run: python restore_control_week_source.py

      - name: Commit result
        run: |
          git config user.name "ppc-agent-bot"
          git config user.email "bot@ppc-agent"
          git add backups/
          git commit -m "Restore control week source data: Campaign report by day, 21-27.09 USA (one-off)" || echo "nothing to commit"
          git push
