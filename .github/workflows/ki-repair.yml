name: KI Repair (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sheets-write-ki
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ADS_CLIENT_ID:           ${{ secrets.ADS_CLIENT_ID }}
      ADS_CLIENT_SECRET:       ${{ secrets.ADS_CLIENT_SECRET }}
      ADS_REFRESH_TOKEN:       ${{ secrets.ADS_REFRESH_TOKEN }}
      ADS_PROFILE_ID_USA:      ${{ secrets.ADS_PROFILE_ID_USA }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Backup KI sheet
        run: |
          python - <<'PY'
          import csv, os
          from sheets import get_sheet
          os.makedirs("backups/ki_pre_repair", exist_ok=True)
          v = get_sheet("Keyword Intelligence USA").get_all_values()
          csv.writer(open("backups/ki_pre_repair/Keyword_Intelligence_USA.csv", "w", newline="", encoding="utf-8")).writerows(v)
          print("backup rows", len(v))
          PY
      - name: Repair weekly KI rows from Amazon reports
        run: python repair_keyword_intelligence.py
      - name: Commit result (always)
        if: always()
        run: |
          git config user.name "ppc-agent-bot"
          git config user.email "bot@ppc-agent"
          git add backups/ki_pre_repair diag/ki_repair || true
          git commit -m "KI repair result" || echo nothing
          git pull --rebase origin main
          git push
