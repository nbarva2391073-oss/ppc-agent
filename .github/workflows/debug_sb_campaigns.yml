name: Debug SB Campaigns

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Check SB campaigns v4 compatibility
        env:
          ADS_CLIENT_ID:       ${{ secrets.ADS_CLIENT_ID }}
          ADS_CLIENT_SECRET:   ${{ secrets.ADS_CLIENT_SECRET }}
          ADS_REFRESH_TOKEN:   ${{ secrets.ADS_REFRESH_TOKEN }}
          ADS_PROFILE_ID_USA:  ${{ secrets.ADS_PROFILE_ID_USA }}
        run: python debug_sb_campaigns.py
