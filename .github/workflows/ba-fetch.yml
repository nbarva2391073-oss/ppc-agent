name: BA Fetch

on:
  schedule:
    # Щодня о 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch: {}

jobs:
  ba-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Brand Analytics reports
        env:
          AMAZON_CLIENT_ID:           ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET:       ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_REFRESH_TOKEN_USA:   ${{ secrets.AMAZON_REFRESH_TOKEN_USA }}
          AMAZON_REFRESH_TOKEN_CA:    ${{ secrets.AMAZON_REFRESH_TOKEN_CA }}
          GOOGLE_CREDENTIALS_JSON:    ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python main_brand_analytics.py --fetch
