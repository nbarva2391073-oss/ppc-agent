name: Backfill BR

on:
  workflow_dispatch:
    inputs:
      market:
        description: 'USA або CA'
        required: true
        type: string
      dates:
        description: 'Дати через пробіл'
        required: true
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Backfill
        env:
          AMAZON_CLIENT_ID:         ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET:     ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_REFRESH_TOKEN_USA: ${{ secrets.AMAZON_REFRESH_TOKEN_USA }}
          AMAZON_REFRESH_TOKEN_CA:  ${{ secrets.AMAZON_REFRESH_TOKEN_CA }}
          GOOGLE_CREDENTIALS_JSON:  ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python backfill_br.py ${{ inputs.market }} ${{ inputs.dates }}
