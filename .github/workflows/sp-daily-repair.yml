name: SP Daily Repair (one-off)
on:
  workflow_dispatch:
    inputs:
      market:
        description: "USA або CA"
        default: "USA"
permissions:
  contents: write
concurrency:
  group: sheets-sp-write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MARKET: ${{ github.event.inputs.market || 'USA' }}
      ADS_PROFILE_ID_CA: ${{ secrets.ADS_PROFILE_ID_CA }}
      ADS_CLIENT_ID:           ${{ secrets.ADS_CLIENT_ID }}
      ADS_CLIENT_SECRET:       ${{ secrets.ADS_CLIENT_SECRET }}
      ADS_REFRESH_TOKEN:       ${{ secrets.ADS_REFRESH_TOKEN }}
      ADS_PROFILE_ID_USA:      ${{ secrets.ADS_PROFILE_ID_USA }}
      ADS_PROFILE_ID_CA:       ${{ secrets.ADS_PROFILE_ID_CA }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Backup tabs before repair
        run: |
          python - <<'PY'
          import csv, os, time
          from sheets import get_sheet
          M=os.environ["MARKET"]; D="backups/sp_pre_repair"+("" if M=="USA" else "_"+M); os.makedirs(D, exist_ok=True)
          for n in [f"Raw Data {M}", f"Advertised Product {M}", f"Keyword Intelligence {M}", f"TACoS_{M}"]:
              v = get_sheet(n).get_all_values()
              csv.writer(open(f"{D}/{n.replace(' ','_')}.csv", "w", newline="", encoding="utf-8")).writerows(v)
              print(n, len(v)); time.sleep(3)
          PY
      - name: Repair
        env:
          ONLY_RAW_KI: ${{ (github.event.inputs.market == 'CA') && '0' || '1' }}
        run: python repair_sp_daily.py
      - name: Commit result (always)
        if: always()
        run: |
          git config user.name "ppc-agent-bot"; git config user.email "bot@ppc-agent"
          git add backups/sp_pre_repair* diag/sp_repair* || true
          git commit -m "SP daily repair result" || echo nothing
          for i in 1 2 3 4; do git fetch origin main && git rebase -X theirs origin/main && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
