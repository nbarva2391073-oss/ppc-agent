name: Business Report

on:
  schedule:
    # Щодня о 09:00 UTC (після того як Amazon оновлює дані за вчора)
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      dates:
        description: "Ручний дозабір днів (YYYY-MM-DD, через кому). Порожньо = звичайний запуск"
        default: ""
      markets:
        description: "Ринки для ручного дозабору"
        default: "USA"


jobs:
  business-report:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Business Report
        env:
          AMAZON_CLIENT_ID:           ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET:       ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_REFRESH_TOKEN_USA:   ${{ secrets.AMAZON_REFRESH_TOKEN_USA }}
          AMAZON_REFRESH_TOKEN_CA:    ${{ secrets.AMAZON_REFRESH_TOKEN_CA }}
          GOOGLE_CREDENTIALS_JSON:    ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          BR_DATES:                   ${{ inputs.dates }}
          BR_MARKETS:                 ${{ inputs.markets }}
        run: python business_report.py
