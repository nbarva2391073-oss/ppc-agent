name: Debug Repeat Purchase

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test Repeat Purchase request
        env:
          AMAZON_CLIENT_ID:         ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET:     ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_REFRESH_TOKEN_USA: ${{ secrets.AMAZON_REFRESH_TOKEN_USA }}
          AMAZON_REFRESH_TOKEN_CA:  ${{ secrets.AMAZON_REFRESH_TOKEN_CA }}
          GOOGLE_CREDENTIALS_JSON:  ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          python3 << 'PYEOF'
          import time, requests, json
          from brand_analytics import get_access_token, request_repeat_purchase_report, check_report_status, SP_API_BASE

          market = "USA"
          token = get_access_token(market)
          report_id = request_repeat_purchase_report(market, token)

          if report_id:
              print(f"\n⏳ Чекаємо перед першою перевіркою...")
              result = None
              for i in range(6):
                  time.sleep(15)
                  result = check_report_status(market, token, report_id)
                  if result["status"] in ("DONE", "FATAL", "CANCELLED"):
                      break
              print(f"\nФінальний результат: {result}")

              doc_id = result.get("document_id")
              if doc_id:
                  print(f"\n🔍 Завантажуємо документ помилки: {doc_id}")
                  resp = requests.get(
                      f"{SP_API_BASE}/reports/2021-06-30/documents/{doc_id}",
                      headers={"x-amz-access-token": token},
                  )
                  print(f"Document metadata status: {resp.status_code}")
                  doc_data = resp.json()
                  print(f"Document metadata: {json.dumps(doc_data, indent=2)}")

                  if doc_data.get("url"):
                      file_resp = requests.get(doc_data["url"])
                      print(f"\n🔍 Вміст документа (перші 2000 символів):")
                      print(file_resp.text[:2000])
          PYEOF
