name: Sponsored Brands

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

jobs:
  sponsored-brands:
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Sponsored Brands
        env:
          ADS_CLIENT_ID:           ${{ secrets.ADS_CLIENT_ID }}
          ADS_CLIENT_SECRET:       ${{ secrets.ADS_CLIENT_SECRET }}
          ADS_REFRESH_TOKEN:       ${{ secrets.ADS_REFRESH_TOKEN }}
          ADS_PROFILE_ID_USA:      ${{ secrets.ADS_PROFILE_ID_USA }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python sponsored_brands.py
